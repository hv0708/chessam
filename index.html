<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHESSAM — Le jeu. L'art. La communauté.</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<style>
body{background:#080808;color:#fff;font-family:system-ui}
.gold{color:#D4AF37}.gold-bg{background:#D4AF37;color:#000}
.orange-bg{background:#FE7E3C;color:#000}
</style>
</head>
<body class="min-h-screen flex flex-col">
<header class="flex justify-between items-center p-4 border-b border-[#D4AF37]/30">
  <h1 class="font-black text-xl gold tracking-widest">CHESSAM</h1>
  <div class="flex gap-2">
    <button id="btn-login" class="px-3 py-1.5 rounded-lg border border-white/20">Connexion</button>
    <button id="btn-signup" class="px-4 py-1.5 rounded-lg font-bold orange-bg">Rejoindre</button>
    <button id="btn-logout" class="px-3 py-1.5 rounded-lg border border-white/20" style="display:none">Déconnexion</button>
  </div>
</header>

<main class="flex-1 grid place-items-center p-6 text-center">
  <div class="max-w-xl">
    <h2 class="text-5xl font-black leading-tight"><span class="gold">Le jeu.</span> L'art. <br>La communauté.</h2>
    <p class="mt-4 text-white/60">Casablanca Chess Club — bientôt en ligne.</p>
    <div id="user-info" class="mt-8 p-4 rounded-xl border border-[#D4AF37]/20 bg-white/5 text-sm">Chargement...</div>
    <p class="mt-6 text-xs text-white/30">hv0708.github.io/chessam</p>
  </div>
</main>

<script src="./chessam-auth.js"></script>
<script>
const $=id=>document.getElementById(id);
const lb=$('btn-login'), sb=$('btn-signup'), ob=$('btn-logout'), info=$('user-info');
function refresh(u){
  if(u){ lb.style.display='none'; sb.style.display='none'; ob.style.display='inline-block'; info.innerHTML='✅ Connecté : <b class="gold">'+u.email+'</b>'; }
  else { lb.style.display='inline-block'; sb.style.display='inline-block'; ob.style.display='none'; info.textContent='Non connecté — Cliquez sur Rejoindre pour créer un compte.'; }
}
window.addEventListener('chessam:auth', e=>refresh(e.detail.user));
lb.onclick=()=>ChessamAuth.open('login');
sb.onclick=()=>ChessamAuth.open('signup');
ob.onclick=()=>ChessamAuth.signOut();
setTimeout(()=>refresh(ChessamAuth.user()),500);
</script>
</body>
</html>
